name: CI

# Runs on every pull request and on every push to main, so a broken build is
# visible on GitHub before it reaches Vercel.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        # `npm run build` runs `tsc -b` first, then the Vite production build.
        run: npm run build
